name: build

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          xcodebuild -scheme Stats \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Ad-hoc sign nested bundles
        run: |
          APP="build/Build/Products/Release/Stats.app"
          find "$APP/Contents" \( -name "*.appex" -o -name "*.app" -o -name "*.framework" \) -print0 \
            | while IFS= read -r -d '' b; do codesign --force --sign - "$b" || true; done
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict "$APP" || true

      - name: Zip
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent Stats.app Stats.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Stats
          path: build/Build/Products/Release/Stats.zip
          if-no-files-found: error
